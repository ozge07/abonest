# Render "blueprint" — depoyu bağlayıp bu dosyayı okutunca servis kuruluyor.
#
# Neden Docker değil de Node çalışma zamanı: aşağıdaki komutların hepsi
# temiz bir klonda birebir çalıştırıldı ve doğrulandı. Dockerfile da depoda
# duruyor (`apps/api/Dockerfile`) ve konteyner isteyen platformlar için —
# ama bu makinede Docker kurulu olmadığı için imaj derlenmedi.
#
# Bu dosya Render'a özel; başka bir platform seçersen değerler aynı kalıyor,
# yalnızca biçim değişiyor. Asıl bilgi burada: derleme komutu, başlatma
# komutu, sağlık yolu ve ortam değişkenleri.

services:
  - type: web
    name: abonest
    runtime: node
    plan: free
    region: frankfurt

    # Sıra zorunlu: shared önce, sonra Prisma istemcisi, sonra api ve web.
    # `prisma generate` veritabanına bağlanmıyor; adres olmadan da çalışıyor
    # (bkz. apps/api/prisma.config.ts).
    #
    # ## Şema neden burada, ayrı bir adımda değil
    #
    # Şema ve başlangıç verisi normalde `preDeployCommand` ile uygulanırdı;
    # Render **ücretsiz katmanda o alanı kabul etmiyor** ("pre-deploy command
    # is not supported for free tier services") ve blueprint hiç
    # uygulanmıyor. Bu yüzden ikisi derleme adımının sonunda.
    #
    # Önemsediğimiz sıra korunuyor: derleme, yeni sürüm ayağa kalkmadan
    # önce bitiyor — yani uygulama hiçbir zaman eksik sütunlu bir şemayla
    # açılmıyor. Bedeli, derlemenin veritabanına erişmesi gerekmesi;
    # `DATABASE_URL` panelde tanımlı olduğu için derleme ortamında da var.
    #
    # İkisi de tekrar çalıştırılabilir: `migrate deploy` bekleyen migration
    # yoksa hiçbir şey yapmıyor, tohumlama `upsert` ile yazıyor. Her
    # dağıtımda koşmaları zararsız.
    # Prisma komutları `apps/api` içinden çalışıyor: `prisma.config.ts` orada
    # ve Prisma onu **çalışma dizininden** arıyor. Depo kökünden `--schema`
    # vererek çağırmak yetmiyor, "datasource.url property is required"
    # diyerek düşüyor. Ölçüldü; bu komut dizisi Neon'a karşı birebir
    # çalıştırılıp doğrulandı.
    buildCommand: |
      set -euo pipefail

      # `--include=dev` şart: servis `NODE_ENV=production` ile çalışıyor ve
      # npm bunu görünce geliştirme bağımlılıklarını **atlıyor**. Derleme
      # onlarsız yapılamıyor — `tsc`, `vite` ve tip paketleri orada.
      #
      # Bu, ilk dağıtımı düşüren hataydı: `@types/nodemailer` kurulmayınca
      # api derlemesi "Could not find a declaration file for module
      # 'nodemailer'" diyerek durdu. Yerelde görünmüyordu çünkü geliştirme
      # makinesinde `NODE_ENV` üretim değil. `NODE_ENV=production npm ci`
      # ile birebir yeniden üretildi.
      npm ci --include=dev
      npm run build -w @abonelik/shared
      npm run prisma:generate -w @abonelik/api
      npm run build -w @abonelik/api
      npm run build -w @abonelik/web

      # Derleme çıktıları gerçekten üretildi mi.
      #
      # İlk dağıtımda arayüz sunulmadı: API ayakta, veritabanı bağlı, ama
      # `/` ve bütün varlıklar 404. Sebep `set -e` olmamasıydı — ara bir
      # komut düşse bile betik devam ediyor ve çıkış kodu **son** komuta
      # bakıyordu. Son komut tohumlamaydı, o da başarılı olunca Render
      # "deploy live" dedi. Yani derleme sessizce yarım kaldı.
      #
      # Artık iki koruma var: `set -e` ilk hatada durduruyor, bu kontroller
      # de "geçti ama dosya yok" durumunu imkânsız kılıyor.
      test -f apps/api/dist/main.js
      test -f apps/web/dist/index.html
      test -d apps/web/dist/assets

      cd apps/api
      npx prisma migrate deploy
      node --experimental-strip-types prisma/seed.ts

    startCommand: node apps/api/dist/main.js

    # Kimlik doğrulama istemiyor ve veritabanına dokunmuyor: süreç ayakta mı
    # sorusunu cevaplıyor. Veritabanı kontrolü ayrı uçta (`/ready`).
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      # Uygulamanın önünde platformun vekili var; `X-Forwarded-For` ondan
      # geliyor. Kapalı olsaydı bütün istekler tek IP'den geliyor görünür ve
      # IP tabanlı hız sınırı herkesi birlikte cezalandırırdı.
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: info
      # Aşağıdakiler panelden girilecek; `sync: false` "bunu ben vermeyeceğim,
      # sen sor" demek. Sırları depoya yazmıyoruz.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      # E-posta HTTP üzerinden gidiyor.
      #
      # SMTP burada çalışmıyor: platform giden SMTP portlarını kapatıyor ve
      # bağlantı `ETIMEDOUT, command: CONN` ile düşüyor — kimlik sorunu bile
      # değil. Brevo'nun HTTP API'si 443 kullandığı için bu engele
      # takılmıyor. SMTP değişkenleri geliştirmede kullanılmaya devam
      # ediyor; ikisinden biri tanımsızsa uygulama üretimde açılmıyor.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
