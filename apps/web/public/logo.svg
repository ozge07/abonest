<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Abonest">
  <!--
    Abonest'in simgesi: tekrar halkasının içinde bir yumurta.

    Ad "abone" ile "nest"i (yuva) birleştiriyor. Halka aboneliğin tekrar
    eden doğasını, yumurta da yuvada saklanan şeyi anlatıyor.

    ## Yumurtanın şekli hesaplanıyor

    Yol elle çizilmedi: `src/lib/yumurta.ts` içindeki bağıntıdan üretildi
    (`w(t) = sin(t)·(0.9 - 0.135·cos(t))`). Giriş ekranındaki büyük
    yumurta, hikâye sayfasındaki 3B kabuk ve yuvadaki altı yumurta da aynı
    bağıntıyı kullanıyor — hepsi **aynı** yumurta.

    Bu ilişki eskiden tersti: logo elle çizilmişti ve 3B model ona
    benzetilmeye çalışılıyordu. Artık tek bir tanım var.

    ## Renkler neden değişti

    Önceki sürüm mavi bir karo üzerinde düz beyaz bir yumurtaydı.
    Uygulama koyu zemin ve bronz-amber bir kimliğe geçince o mavi karo
    yabancı kaldı. Şimdi zemin uygulamanın kendi zemini, yumurta da
    ekrandaki kabuğun aynısı: sol üstten ışık, sağ altta gölge.

    ## Denenip elenenler

    - **Yuva + üç yumurta:** 16 pikselde örgü çizgileri ve yumurtalar tek
      bir lekeye dönüştü, okunmuyordu.
    - **Kâse + tek yumurta:** 512 pikselde evrensel profil/avatar ikonuna
      benzedi. Marka simgesinin başka bir şeye benzemesi, okunmamasından
      daha kötü.

    Halka çevrelediği için avatar okuması oluşmuyor; tek büyük şekil
    olduğu için de küçülünce dağılmıyor. Halka favicon boyutunda
    silikleşip geriye okunaklı bir yumurta bırakıyor — küçüldükçe
    bozulmak yerine sadeleşiyor.
  -->
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1420" />
      <stop offset="1" stop-color="#07080B" />
    </linearGradient>

    <linearGradient id="kabuk" x1="0.24" y1="0.06" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#FFF3DE" />
      <stop offset="0.4" stop-color="#F5CE9A" />
      <stop offset="0.75" stop-color="#D89B58" />
      <stop offset="1" stop-color="#96602C" />
    </linearGradient>

    <!-- Işığın vurduğu yer; kenara değmeden sönüyor. -->
    <radialGradient id="parlama" cx="0.36" cy="0.26" r="0.4">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

