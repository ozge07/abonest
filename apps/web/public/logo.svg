<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Abonest">
  <!--
    Abonest'in simgesi: tekrar halkasının içinde bir yumurta.

    Ad "abone" ile "nest"i (yuva) birleştiriyor. Halka aboneliğin tekrar
    eden doğasını, yumurta da yuvada saklanan şeyi anlatıyor — dağınık
    abonelikler tek yerde.

    ## Denenip elenenler

    Simge önce **yuva + üç yumurta** olarak çizildi: 16 pikselde (arama
    çubuğundaki favicon boyutu) örgü çizgileri ve yumurtalar tek bir
    lekeye dönüştü. Küçültülüp bakıldı, okunmuyordu.

    Sonra **kâse + tek yumurta** denendi: bu sefer 512 pikselde beyaz oval
    + geniş kâse, evrensel **profil/avatar** ikonuna benzedi. Marka
    simgesinin başka bir şeye benzemesi, okunmamasından daha kötü.

    Kalan çözüm ikisinin ortası: yumurta kapalı bir kâsede değil, açık bir
    halkanın içinde. Halka çevrelediği için avatar okuması oluşmuyor;
    tek büyük şekil olduğu için de küçülünce dağılmıyor.

    ## Neden iki katman

    Halka soluk (0.45) ve arkada, yumurta solid ve önde. Aynı beyazla
    çizilselerdi küçük boyutta birleşirlerdi. Halka favicon boyutunda
    silikleşip geriye okunaklı bir yumurta bırakıyor — küçüldükçe bozulmak
    yerine sadeleşiyor.
  -->
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7DD1" />
      <stop offset="1" stop-color="#1B4F91" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#zemin)" />

  <!-- Tekrar halkası: uçları açık, dönüyormuş izlenimi veriyor. -->
  <circle
    cx="32" cy="32" r="20"
    fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="4.5"
    stroke-linecap="round" stroke-dasharray="82 44"
    transform="rotate(-105 32 32)"
  />

  <!-- Yumurta: tepesi dar, tabanı geniş. Simetrik bir oval "nokta" gibi
       duruyordu; asimetri onu bir şeye benzetiyor. -->
  <path
    d="M32 21 C38.5 21 41.5 28 41.5 33.2 C41.5 39.2 37.2 43 32 43
       C26.8 43 22.5 39.2 22.5 33.2 C22.5 28 25.5 21 32 21 Z"
    fill="#FFFFFF"
  />
</svg>
