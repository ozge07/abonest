<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Abonest">
  <!--
    Abonest'in simgesi: tekrar halkasının içinde bir S.

    İki katman iki iş yapıyor. Dıştaki kesik halka aboneliğin tekrar eden
    doğasını anlatıyor; içteki S markanın harfi. Halka bilerek soluk —
    dikkati harften çalmıyor ve favicon boyutunda gözden kaybolup geriye
    okunaklı bir S bırakıyor. Küçüldükçe bozulmak yerine sadeleşiyor.

    Kalın çizgi ve tek renk: 16 pikselde ince ayrıntı bulanık bir lekeye
    dönüşüyor.
  -->
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7DD1" />
      <stop offset="1" stop-color="#1B4F91" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#zemin)" />

  <!-- Tekrar halkası: uçları açık, dönüyormuş izlenimi veriyor. -->
  <circle
    cx="32" cy="32" r="20"
    fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="4.5"
    stroke-linecap="round" stroke-dasharray="82 44"
    transform="rotate(-105 32 32)"
  />

  <!-- Markanın harfi. -->
  <path
    d="M39 24c-2.2-3-6-4-9.5-3s-5.3 4-4.3 7 5 3.8 8.5 4.8 6.9 1.8 7.9 4.8-.8 6-4.3 7-7.3 0-9.5-3"
    fill="none" stroke="#FFFFFF" stroke-width="6.2" stroke-linecap="round"
  />
</svg>
