<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Abonest">
  <!--
    Abonest'in simgesi: tekrar halkasının içinde bir A.

    İki katman iki iş yapıyor. Dıştaki kesik halka aboneliğin tekrar eden
    doğasını anlatıyor; içteki A markanın harfi. Halka bilerek soluk —
    dikkati harften çalmıyor ve favicon boyutunda gözden kaybolup geriye
    okunaklı bir A bırakıyor. Küçüldükçe bozulmak yerine sadeleşiyor.

    Kalın çizgi ve tek renk: 16 pikselde ince ayrıntı bulanık bir lekeye
    dönüşüyor. Harfin kolları halkanın içinde kalıyor; taşsaydı küçük
    boyutta ikisi birbirine karışırdı.
  -->
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7DD1" />
      <stop offset="1" stop-color="#1B4F91" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#zemin)" />

  <!-- Tekrar halkası: uçları açık, dönüyormuş izlenimi veriyor. -->
  <circle
    cx="32" cy="32" r="20"
    fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="4.5"
    stroke-linecap="round" stroke-dasharray="82 44"
    transform="rotate(-105 32 32)"
  />

  <!-- Markanın harfi: iki bacak tek çizgide, tepe yuvarlatılmış. -->
  <path
    d="M24 42.5 32 22.5 40 42.5"
    fill="none" stroke="#FFFFFF" stroke-width="6"
    stroke-linecap="round" stroke-linejoin="round"
  />
  <!--
    Orta çizgi alçakta ve ince: yukarıda ya da kalın olsaydı harfin
    içindeki üçgen boşluk 16 pikselde dolar, A bir lekeye dönerdi.
  -->
  <path
    d="M27.6 37.5h8.8"
    fill="none" stroke="#FFFFFF" stroke-width="4.4"
    stroke-linecap="round"
  />
</svg>
