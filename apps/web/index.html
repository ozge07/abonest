<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abonest — Abonelik takibi</title>

    <!--
      Favicon üç biçimde: SVG modern tarayıcılarda keskin ve tema
      değişiminde bozulmuyor; PNG'ler SVG kabul etmeyen platformlar ve iOS
      ana ekranı için.

      ## Sondaki `?v=` ne işe yarıyor

      Tarayıcılar favicon'u sayfanın geri kalanından **ayrı** bir önbellekte
      tutuyor; `cache-control: no-cache` göndersek bile sıradan yenilemede,
      çoğu zaman sert yenilemede bile eskisini göstermeye devam ediyorlar.
      Logo değiştiğinde kullanıcı adres çubuğunda eski simgeyi görmeye
      devam ediyordu — ölçüldü: sunucu yeni dosyayı veriyordu, tarayıcı
      eskisini çiziyordu.

      Sürüm numarası adresi değiştiriyor, dolayısıyla önbellekte karşılığı
      olmuyor ve dosya yeniden çekiliyor. **Logo her değiştiğinde bu sayı
      artırılmalı;** aksi hâlde değişikliği yalnızca önbelleği boş olan
      yeni kullanıcılar görür.
    -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png?v=2" />
    <link rel="apple-touch-icon" href="/logo-180.png?v=2" />
    <meta name="theme-color" content="#1B4F91" />
    <meta
      name="description"
      content="Aboneliklerini tek yerden takip et: ne kadar gidiyor, sırada ne var, neyi kullanmıyorsun."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
