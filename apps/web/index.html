<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abonest — Abonelik takibi</title>

    <!--
      Favicon üç biçimde: SVG modern tarayıcılarda keskin ve tema
      değişiminde bozulmuyor; PNG'ler SVG kabul etmeyen platformlar ve iOS
      ana ekranı için.

      ## Sondaki `?v=` ne işe yarıyor

      Tarayıcılar favicon'u sayfanın geri kalanından **ayrı** bir önbellekte
      tutuyor; `cache-control: no-cache` göndersek bile sıradan yenilemede,
      çoğu zaman sert yenilemede bile eskisini göstermeye devam ediyorlar.
      Logo değiştiğinde kullanıcı adres çubuğunda eski simgeyi görmeye
      devam ediyordu — ölçüldü: sunucu yeni dosyayı veriyordu, tarayıcı
      eskisini çiziyordu.

      Sürüm numarası adresi değiştiriyor, dolayısıyla önbellekte karşılığı
      olmuyor ve dosya yeniden çekiliyor. **Logo her değiştiğinde bu sayı
      artırılmalı;** aksi hâlde değişikliği yalnızca önbelleği boş olan
      yeni kullanıcılar görür.
    -->
    <!--
      `favicon.ico` ayrıca duruyor: tarayıcılar bu adresi, sayfada bildirilse
      de bildirilmese de kendiliğinden istiyor. Dosya yokken sunucu SPA geri
      dönüşüyle `index.html` veriyordu — yani simge isteğine HTML yanıt.
    -->
    <link rel="icon" sizes="48x48" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png?v=3" />
    <link rel="apple-touch-icon" href="/logo-180.png?v=3" />
    <meta name="theme-color" content="#0b0c10" />
    <meta
      name="description"
      content="Aboneliklerini tek yerden takip et: ne kadar gidiyor, sırada ne var, neyi kullanmıyorsun."
    />

    <!--
      Aşağıdaki mutlak adresler `%SITE_ADRESI%` yer tutucusundan geliyor;
      değeri `vite.config.ts` dolduruyor. Elle yazılsalardı alan adı
      değiştiğinde biri güncellenip diğerleri eski adreste kalırdı.
    -->

    <!--
      Kanonik adres: aynı sayfaya birden çok yoldan ulaşılabiliyor
      (`?utm_...` ekli paylaşımlar, `www` varyantı). Kanonik olmadan arama
      motoru bunları ayrı sayfalar sayıp aralarında sinyal bölüştürüyor.
    -->
    <link rel="canonical" href="%SITE_ADRESI%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Abonest" />
    <meta property="og:title" content="Abonest — Abonelik takibi" />
    <meta
      property="og:description"
      content="Aboneliklerini tek yerden takip et: ne kadar gidiyor, sırada ne var, neyi kullanmıyorsun."
    />
    <meta property="og:url" content="%SITE_ADRESI%/" />
    <meta property="og:image" content="%SITE_ADRESI%/logo-512.png?v=3" />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary" />

    <!--
      Yapısal veri: arama motoruna sitenin bir uygulama olduğunu ve adının
      "Abonest" olduğunu makine okunur biçimde söylüyor.

      `type="application/ld+json"` çalıştırılan bir betik değil, veri bloğu;
      tarayıcı onu yorumlamadığı için `script-src 'self'` politikası
      engellemiyor (bkz. `app.setup.ts` içindeki ARAYUZ_CSP).
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Abonest",
        "url": "%SITE_ADRESI%/",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "inLanguage": "tr-TR",
        "description": "Aboneliklerini tek yerden takip et: ne kadar gidiyor, sırada ne var, neyi kullanmıyorsun.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TRY" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
